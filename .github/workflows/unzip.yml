name: Unzip update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and copy files
        run: |
          set -e
          test -f update.zip
          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q update.zip -d /tmp/upd
          N=$(ls -A /tmp/upd | wc -l)
          if [ "$N" = "1" ] && [ -d "/tmp/upd/$(ls -A /tmp/upd)" ]; then
            SRC="/tmp/upd/$(ls -A /tmp/upd)"
          else
            SRC=/tmp/upd
          fi
          rm -rf "$SRC/.github" "$SRC/.git"
          cp -a "$SRC"/. .
          rm -f update.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply update.zip" || echo "nothing changed"
          git push
